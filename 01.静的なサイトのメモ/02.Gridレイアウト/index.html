<!DOCTYPE html>

<html>
    <head>
        <meta charset="UTF-8">
        <title>Document</title>
        <style>
            p {
                border: 1px solid #000000;
                text-align: center;
            }

            .three-column-2row-grid {
                display: grid;
                grid-template-columns: 1fr 1fr auto; /* 幅の比率は1:1:1 */
                gap: 10px; /*幅*/
            }
        </style>
    </head>

    <body>
        <div class="three-column-2row-grid">
            <p>hoge</p>
            <p>hoge</p>
            <p>hoge</p>

            <p>hoge</p>
            <p>hoge</p>
            <p>hoge</p>
        </div>
    </body>
</html>
